<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starling Murmuration</title>
<style>
  :root {
    --sky-top: #1d2340;
    --sky-mid: #6b4a6e;
    --sky-low: #e3876a;
    --sky-glow: #f6c58a;
    --ground: #0d0f18;
    --ink: rgba(245, 235, 225, 0.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  .hud {
    position: fixed; left: 16px; bottom: 14px; right: 16px;
    font: 12px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.04em; color: var(--ink); pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .hud b { font-weight: 600; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b>400 starlings</b> · each watches its 7 nearest neighbours · move to disturb · click to release a falcon · space to pause</div>
<script>
(() => {
  const N = 400;          // flock size
  const K = 7;            // topological neighbours (real starlings track ~6–7)
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, sky = null;

  // ---- tuning -------------------------------------------------------------
  const P = {
    minSpeed: 2.2, maxSpeed: 4.6,
    maxForce: 0.14,
    sepDist: 9,
    wSep: 1.7, wAli: 1.1, wCoh: 0.8,
    wRoost: 1.2,
    fearRadius: 150, wFear: 3.2,
    jitter: 0.05,
  };

  // ---- flock state in flat typed arrays -----------------------------------
  const x = new Float32Array(N), y = new Float32Array(N);
  const vx = new Float32Array(N), vy = new Float32Array(N);
  const ax = new Float32Array(N), ay = new Float32Array(N);
  const phase = new Float32Array(N), size = new Float32Array(N);
  const fear = new Float32Array(N);
  const nIdx = new Int32Array(K), nD2 = new Float32Array(K);

  const pointer = { x: -1e4, y: -1e4, active: false, t: 0 };
  const falcon = { on: false, x: 0, y: 0, vx: 0, vy: 0, t: 0 };
  let roostX = 0, roostY = 0, time = 0, paused = false, nextFalcon = 900;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sky = buildSky();
  }

  function init() {
    const cx = W * 0.5, cy = H * 0.4;
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * Math.min(W, H) * 0.18;
      x[i] = cx + Math.cos(a) * r * 1.6;
      y[i] = cy + Math.sin(a) * r * 0.8;
      const h = Math.random() * Math.PI * 2;
      vx[i] = Math.cos(h) * 3; vy[i] = Math.sin(h) * 3;
      phase[i] = Math.random() * Math.PI * 2;
      size[i] = 0.75 + Math.random() * 0.5;
    }
  }

  // ---- background: dusk gradient, sun glow, tree-line silhouette ----------
  function buildSky() {
    const off = document.createElement('canvas');
    off.width = W * DPR; off.height = H * DPR;
    const g = off.getContext('2d');
    g.scale(DPR, DPR);
    const css = getComputedStyle(document.documentElement);
    const c = n => css.getPropertyValue(n).trim();

    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, c('--sky-top'));
    grad.addColorStop(0.55, c('--sky-mid'));
    grad.addColorStop(0.86, c('--sky-low'));
    grad.addColorStop(1, c('--sky-glow'));
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    const sun = g.createRadialGradient(W * 0.68, H * 0.92, 0, W * 0.68, H * 0.92, Math.max(W, H) * 0.55);
    sun.addColorStop(0, 'rgba(255,214,150,0.55)');
    sun.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = sun; g.fillRect(0, 0, W, H);

    // reed bed / tree line where the flock will roost
    g.fillStyle = c('--ground');
    g.beginPath();
    g.moveTo(0, H);
    const base = H * 0.9;
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let px = 0; px <= W + 8; px += 6) {
      const hill = Math.sin(px * 0.004) * 10 + Math.sin(px * 0.011 + 1) * 5;
      const tree = rnd() < 0.18 ? rnd() * 38 : rnd() * 9;
      g.lineTo(px, base - hill - tree);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
    return off;
  }

  // ---- simulation ---------------------------------------------------------
  function limit(i, max) {
    const m2 = ax[i] * ax[i] + ay[i] * ay[i];
    if (m2 > max * max) { const s = max / Math.sqrt(m2); ax[i] *= s; ay[i] *= s; }
  }

  function steer(i, tx, ty, w) {
    // Reynolds steering: desired velocity minus current velocity
    const m = Math.hypot(tx, ty) || 1;
    const dx = tx / m * P.maxSpeed - vx[i], dy = ty / m * P.maxSpeed - vy[i];
    ax[i] += dx * w; ay[i] += dy * w;
  }

  function step(dt) {
    time += dt;

    // drifting roost point traces a slow Lissajous so the flock keeps folding
    roostX = W * (0.5 + 0.28 * Math.sin(time * 0.0031) + 0.08 * Math.sin(time * 0.011));
    roostY = H * (0.42 + 0.16 * Math.sin(time * 0.0047 + 1.3) + 0.05 * Math.cos(time * 0.013));
    const roostR = Math.min(W, H) * 0.16;

    updateFalcon(dt);
    const threats = [];
    if (falcon.on) threats.push(falcon.x, falcon.y);
    if (pointer.active && time - pointer.t < 90) threats.push(pointer.x, pointer.y);

    for (let i = 0; i < N; i++) {
      // k nearest neighbours by insertion into a tiny sorted buffer
      let cnt = 0;
      const xi = x[i], yi = y[i];
      for (let j = 0; j < N; j++) {
        if (j === i) continue;
        const dx = x[j] - xi, dy = y[j] - yi, d2 = dx * dx + dy * dy;
        if (cnt < K) {
          let p = cnt++;
          while (p > 0 && nD2[p - 1] > d2) { nD2[p] = nD2[p - 1]; nIdx[p] = nIdx[p - 1]; p--; }
          nD2[p] = d2; nIdx[p] = j;
        } else if (d2 < nD2[K - 1]) {
          let p = K - 1;
          while (p > 0 && nD2[p - 1] > d2) { nD2[p] = nD2[p - 1]; nIdx[p] = nIdx[p - 1]; p--; }
          nD2[p] = d2; nIdx[p] = j;
        }
      }

      let sx = 0, sy = 0, alx = 0, aly = 0, cx = 0, cy = 0, fearSum = 0;
      for (let k = 0; k < cnt; k++) {
        const j = nIdx[k], d = Math.sqrt(nD2[k]) || 0.001;
        if (d < P.sepDist) { const f = (P.sepDist - d) / (P.sepDist * d); sx -= (x[j] - xi) * f; sy -= (y[j] - yi) * f; }
        alx += vx[j]; aly += vy[j];
        cx += x[j]; cy += y[j];
        fearSum += fear[j];
      }
      ax[i] = 0; ay[i] = 0;
      if (cnt) {
        if (sx || sy) steer(i, sx, sy, P.wSep * 0.1);
        steer(i, alx, aly, P.wAli * 0.1);
        steer(i, cx / cnt - xi, cy / cnt - yi, P.wCoh * 0.1);
      }

      // soft pull back toward the roost once outside its radius
      const rx = roostX - xi, ry = roostY - yi, rd = Math.hypot(rx, ry);
      if (rd > roostR) steer(i, rx, ry, P.wRoost * 0.1 * Math.min(1, (rd - roostR) / roostR));

      // keep within the sky: off the tree line and away from the frame edges
      const m = 40;
      if (yi > H * 0.8) ay[i] -= (yi - H * 0.8) * 0.004;
      if (yi < m) ay[i] += (m - yi) * 0.004;
      if (xi < m) ax[i] += (m - xi) * 0.004;
      if (xi > W - m) ax[i] -= (xi - W + m) * 0.004;

      // fear: flee threats directly; neighbours' fear spreads like a wave
      let f = fear[i] * 0.94 + (cnt ? fearSum / cnt : 0) * 0.045;
      for (let t = 0; t < threats.length; t += 2) {
        const dx = xi - threats[t], dy = yi - threats[t + 1], d = Math.hypot(dx, dy);
        if (d < P.fearRadius) {
          const s = 1 - d / P.fearRadius;
          steer(i, dx, dy, P.wFear * 0.1 * s);
          f = Math.max(f, s);
        }
      }
      fear[i] = Math.min(1, f);

      ax[i] += (Math.random() - 0.5) * P.jitter;
      ay[i] += (Math.random() - 0.5) * P.jitter;
      limit(i, P.maxForce * (1 + fear[i] * 1.5));
    }

    for (let i = 0; i < N; i++) {
      vx[i] += ax[i] * dt; vy[i] += ay[i] * dt;
      const sp = Math.hypot(vx[i], vy[i]);
      const hi = P.maxSpeed * (1 + fear[i] * 0.45);
      const clamp = sp > hi ? hi / sp : sp < P.minSpeed ? P.minSpeed / (sp || 1) : 1;
      vx[i] *= clamp; vy[i] *= clamp;
      x[i] += vx[i] * dt; y[i] += vy[i] * dt;
      phase[i] += (0.32 + fear[i] * 0.35) * dt;
    }
  }

  function centroid() {
    let cx = 0, cy = 0;
    for (let i = 0; i < N; i++) { cx += x[i]; cy += y[i]; }
    return [cx / N, cy / N];
  }

  function launchFalcon(tx, ty) {
    const [cx, cy] = tx === undefined ? centroid() : [tx, ty];
    const fromLeft = Math.random() < 0.5;
    falcon.x = fromLeft ? -40 : W + 40;
    falcon.y = Math.max(-40, cy - H * (0.3 + Math.random() * 0.3));
    const dx = cx - falcon.x, dy = cy - falcon.y, d = Math.hypot(dx, dy) || 1;
    falcon.vx = dx / d * 7; falcon.vy = dy / d * 7;
    falcon.on = true; falcon.t = 0;
  }

  function updateFalcon(dt) {
    if (!falcon.on) {
      nextFalcon -= dt;
      if (nextFalcon <= 0) { launchFalcon(); nextFalcon = 1100 + Math.random() * 1400; }
      return;
    }
    falcon.t += dt;
    // home on the flock for a moment, then commit to a straight stoop
    if (falcon.t < 70) {
      const [cx, cy] = centroid();
      const dx = cx - falcon.x, dy = cy - falcon.y, d = Math.hypot(dx, dy) || 1;
      falcon.vx += (dx / d * 7.5 - falcon.vx) * 0.04 * dt;
      falcon.vy += (dy / d * 7.5 - falcon.vy) * 0.04 * dt;
    }
    falcon.x += falcon.vx * dt; falcon.y += falcon.vy * dt;
    if (falcon.t > 60 && (falcon.x < -80 || falcon.x > W + 80 || falcon.y < -80 || falcon.y > H + 80)) falcon.on = false;
  }

  // ---- rendering ----------------------------------------------------------
  function draw() {
    ctx.drawImage(sky, 0, 0, W, H);

    // all birds in one path: a four-point silhouette whose wingspan pulses
    ctx.fillStyle = 'rgba(12, 10, 20, 0.88)';
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const sp = Math.hypot(vx[i], vy[i]) || 1;
      const hx = vx[i] / sp, hy = vy[i] / sp;       // heading
      const px = -hy, py = hx;                       // perpendicular
      const s = size[i] * (Math.min(W, H) < 600 ? 1.2 : 1.5);
      const flap = 0.55 + 0.45 * Math.sin(phase[i]);
      const span = s * (1.4 + flap * 1.3), sweep = s * (0.2 + (1 - flap) * 0.9);
      const bx = x[i], by = y[i];
      ctx.moveTo(bx + hx * s * 1.3, by + hy * s * 1.3);
      ctx.lineTo(bx - hx * sweep + px * span, by - hy * sweep + py * span);
      ctx.lineTo(bx - hx * s * 0.9, by - hy * s * 0.9);
      ctx.lineTo(bx - hx * sweep - px * span, by - hy * sweep - py * span);
      ctx.closePath();
    }
    ctx.fill();

    if (falcon.on) {
      const sp = Math.hypot(falcon.vx, falcon.vy) || 1;
      const hx = falcon.vx / sp, hy = falcon.vy / sp, px = -hy, py = hx;
      const s = 6, fx = falcon.x, fy = falcon.y;
      ctx.fillStyle = '#07060c';
      ctx.beginPath();
      ctx.moveTo(fx + hx * s * 1.6, fy + hy * s * 1.6);
      ctx.lineTo(fx - hx * s * 0.6 + px * s * 2.2, fy - hy * s * 0.6 + py * s * 2.2);
      ctx.lineTo(fx - hx * s * 1.4, fy - hy * s * 1.4);
      ctx.lineTo(fx - hx * s * 0.6 - px * s * 2.2, fy - hy * s * 0.6 - py * s * 2.2);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- loop & input -------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2.5, (now - last) / (1000 / 60));
    last = now;
    if (!paused) step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function setPointer(e) {
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top;
    pointer.active = true; pointer.t = time;
  }
  canvas.addEventListener('pointermove', setPointer);
  canvas.addEventListener('pointerdown', e => { setPointer(e); launchFalcon(pointer.x, pointer.y); });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });
  window.addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });
  window.addEventListener('resize', resize);

  resize();
  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
